services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate() }" | mongosh --quiet
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 3 &&
        mongosh --host mongo:27017 --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
          }
        '
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongo
      - mongo-init
      - redis
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/ciro_fuel?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    # DEVELOPMENT ONLY (spec 012 T079). `docker-compose.prod.yml` has no
    # `env_file` at all: production fetches secrets at startup from the managed
    # store via the VM's attached identity (FR-043), so no image, snapshot or
    # backup contains one. `.env` is in both `.gitignore` and `.dockerignore`,
    # so it reaches neither the repository nor the build context — this line
    # mounts it at RUN time, into a stack that never leaves a developer machine.
    env_file:
      - .env
    volumes:
      # LOCAL DRIVER ONLY (spec 012 T070). Development runs STORAGE_DRIVER=local
      # and writes a real `sys_storge` directory, so this mount is what makes
      # uploads survive a container rebuild on a developer's machine.
      #
      # `docker-compose.prod.yml` deliberately has NO equivalent: production runs
      # STORAGE_DRIVER=gcs and documents live in the regional bucket (FR-036),
      # so durability is the bucket's rather than one disk's. Keeping a mount
      # there would be a directory nothing ever writes to, quietly implying a
      # local copy exists.
      - ./sys_storge:/app/sys_storge

volumes:
  mongo_data:
  redis_data:
