services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate() }" | mongosh --quiet
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 3 &&
        mongosh --host mongo:27017 --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
          }
        '
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongo
      - mongo-init
      - redis
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/ciro_fuel?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./sys_storge:/app/sys_storge

volumes:
  mongo_data:
  redis_data:
