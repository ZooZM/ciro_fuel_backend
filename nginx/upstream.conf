# The app upstream — spec 012, FR-007a.
#
# THIS FILE IS REWRITTEN BY A SCRIPT. `scripts/readiness-monitor.sh` comments a
# server line out when that instance fails `/health/ready` for
# READINESS_FAILURE_THRESHOLD consecutive polls, and restores it after
# READINESS_RECOVERY_THRESHOLD healthy ones, reloading nginx each time.
#
# Why a script and not nginx itself: **open-source nginx cannot poll a health
# endpoint.** Active upstream health checks (`health_check`) are an nginx Plus
# feature. What OSS nginx has is `max_fails`/`fail_timeout` below — PASSIVE
# detection, which reacts only to real proxied requests failing, and only for
# the conditions `proxy_next_upstream` names (see nginx.conf). That is a
# genuine safety net but it is not sufficient on its own (FR-007b): an instance
# failing readiness for a reason that does not break every route stays in
# rotation indefinitely, serving whatever subset of traffic still works, while
# readiness has been saying "do not send me traffic" the whole time.
#
# Keep the marker comments and the one-server-per-line format exactly as they
# are — the monitor matches on them with sed.
#
# Compose service names, not 127.0.0.1: nginx runs as a container here, so
# loopback is the nginx container itself. The instances publish to the host's
# loopback as well (127.0.0.1:3001/3002) and THAT is what the monitor polls,
# from the host.
upstream app_upstream {
    # BEGIN MANAGED UPSTREAM
    server app-1:3000 max_fails=3 fail_timeout=10s;  # instance=app-1
    server app-2:3000 max_fails=3 fail_timeout=10s;  # instance=app-2
    # END MANAGED UPSTREAM

    # Reuse connections to the instances. Without this every proxied request
    # opens a fresh TCP connection, which at the platform's request rate is
    # pure latency.
    keepalive 32;
}
