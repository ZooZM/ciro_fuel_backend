# nginx — spec 012 (production hardening), operations-contract.md §2.
#
# Mounted at /etc/nginx/conf.d/default.conf, so this file sits INSIDE the stock
# image's `http {}` block. `upstream.conf` is mounted alongside it and defines
# `app_upstream`; it is a separate file because the readiness monitor rewrites
# it (FR-007a) and must not be able to corrupt the server blocks here.

# Redirect plain HTTP. The platform is only ever reached over TLS; the
# allowlisted dashboard origins are all https, so an http origin would fail
# CORS anyway — this makes the failure a redirect rather than a confusing
# cross-origin refusal.
server {
    listen 80;
    server_name _;

    # Health probes must answer on plain HTTP too: the readiness monitor and
    # any future uptime check should not need a certificate to ask an instance
    # whether it is alive.
    location /api/v1/health/ {
        access_log off;
        proxy_pass http://app_upstream;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Uploads go through here (FR-036). Keep this at or above
    # MAX_FILE_SIZE_BYTES or nginx rejects the request with a 413 before the
    # application's own limit — and its own error page, not the platform's
    # standard error shape.
    client_max_body_size 10m;

    # ---- Trust boundary (FR-022, T039) --------------------------------------
    # SET, never append. `$proxy_add_x_forwarded_for` appends to whatever the
    # client sent, so with `trust proxy = 1` the application would read a
    # CLIENT-CONTROLLED value as the request origin: anyone wanting a fresh
    # rate-limit budget could simply send their own X-Forwarded-For header.
    # The resulting defect is invisible — rate limiting appears to work.
    #
    # This single directive is the whole trust boundary. TRUSTED_PROXY_HOPS=1
    # is only correct because nginx is the ONLY proxy; if a managed load
    # balancer is put in front, this becomes `$proxy_add_x_forwarded_for` AND
    # the hop count becomes 2. Change both or neither.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;

    # Realtime namespace. Needs the upgrade dance and a read timeout well above
    # the Socket.io ping interval, or nginx cuts long-lived connections and the
    # clients reconnect in a loop.
    #
    # No sticky sessions and no ip_hash: once the Redis adapter is attached
    # (FR-059) an emission from either instance reaches every client, so a
    # socket may land on either. Adding stickiness here would silently mask a
    # broken adapter — the one failure mode that is indistinguishable from
    # success from the emitting instance's own vantage point.
    location /tracking/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health probes. ~720 probes/hour/instance from the monitor alone would be
    # billable noise in the collected records, and they carry no diagnostic
    # value — a failing probe is visible in the monitor's own output.
    location /api/v1/health/ {
        access_log off;
        proxy_pass http://app_upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ---- FR-007c ------------------------------------------------------
        # Two jobs, and the second is the non-obvious one:
        #
        #  1. Retry a failed request against the healthy instance. This is what
        #     actually protects users during the monitor's detection gap.
        #
        #  2. Make 502/503 COUNT as upstream failures. nginx's default set is
        #     `error timeout` only, and `max_fails` counts exactly what this
        #     directive names — so WITHOUT http_502/http_503 a readiness-failing
        #     instance returning clean 503s is never marked down at all, and the
        #     passive detection in upstream.conf does nothing whatsoever.
        #
        # `non_idempotent` is deliberately ABSENT: nginx already refuses to
        # retry POST/PATCH/LOCK unless it is present, and the platform's write
        # endpoints are not established as safe to replay — retrying an order
        # creation or a payment webhook is worse than failing it. Do not add it.
        proxy_next_upstream       error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
